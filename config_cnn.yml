# DO NOT MOVE, UNLESS NECESSARY!!!

- module_name: "preprocess"

  module_config:

    preprocess_method: "None"

- module_name: "model"

  module_config:

    model_name: "CNN1d"

    model_init_config:
      input_len_1: 220500  # 64340, 132300, 220500
      input_len_2: 1
      layers_param:
        - layer_name: "Conv1D"
          layer_kwargs:
            filters: 80
            kernel_size: 800
            activation: "relu"
            strides: 10
        - layer_name: "MaxPooling1D"
          layer_kwargs:
            pool_size: 6
        - layer_name: "Conv1D"
          layer_kwargs:
            filters: 40
            kernel_size: 20
            activation: "relu"
            strides: 2
        - layer_name: "MaxPooling1D"
          layer_kwargs:
            pool_size: 4
        - layer_name: "Flatten"
        - layer_name: "Dense"
          layer_kwargs:
            units: 256
            activation: "relu"
        - layer_name: "Dense"
          layer_kwargs:
            units: 1
            activation: "sigmoid"
      compile_param:
        optimizer: 'adam'
        loss: 'binary_crossentropy'
        metrics:
          - accuracy

    model_compile_config:
      optimizer: "adam"
      loss: "binary_crossentropy"
      metrics:
        - accuracy

    model_fit_config:
      balance_sample_number: False
      cycles: 1
      epochs: 5
      batch_size: 30
      early_stop: False
      class_weight:
        0: 1
        1: 1

    model_predict_config:
      acc_req: 0.8